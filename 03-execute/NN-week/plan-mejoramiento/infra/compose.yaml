name: board-games

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: board_games
      POSTGRES_USER: board_games
      POSTGRES_PASSWORD: local_compose_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "board_games", "-d", "board_games"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ../api/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: board_games
      DB_USERNAME: board_games
      DB_PASSWORD: local_compose_only
      APP_CONFIG_CACHE: /tmp/board-games-config.php
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../api:/app
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - sh
      - -ec
      - |
        if [ -f /app/vendor/autoload.php ]; then
          echo "Usando las dependencias locales de Laravel."
        else
          composer install --no-interaction --prefer-dist
        fi
        php artisan config:cache
        php artisan migrate --seed --force
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit((json_decode((string) @file_get_contents("http://127.0.0.1:8000/api/v1/health"), true)["status"] ?? null) === "ok" ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    image: node:24
    working_dir: /app
    volumes:
      - ../app:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command:
      - sh
      - -ec
      - |
        npm install
        exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

volumes:
  postgres_data:
  web_node_modules: